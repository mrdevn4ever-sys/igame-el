name: iPad Simulator-Test

on:
  push:
    branches: [claude/ellies-entdeckerinsel]
    paths:
      - "EllieInsel/**"
      - "tools/sim_screenshots.sh"
      - ".github/workflows/ipad-test.yml"
  workflow_dispatch:
    inputs:
      nur:
        description: "Nur Durchläufe, deren Name dieses Muster enthält (leer = alle)"
        required: false
        default: ""

concurrency:
  group: ipad-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    runs-on: macos-26
    timeout-minutes: 75
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Xcode 26 wählen
        run: |
          ls -d /Applications/Xcode*.app
          # Neueste stabile Xcode-26-Version (App Store Connect verlangt das iOS-26-SDK)
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -viE "beta|release_candidate|_rc" | sort -V | tail -1)
          [ -n "$XC" ] || XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$XC" ] || { echo "::error::Kein Xcode 26 auf dem Runner gefunden"; exit 1; }
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: iPad-Simulator wählen und starten
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          c=[(r,x) for r,l in d.items() if 'iOS' in r for x in l if 'iPad' in x['name']]
          c.sort(key=lambda t:(('iPad Pro 13' in t[1]['name']) or ('iPad Pro (12.9' in t[1]['name']), t[0]), reverse=True)
          print(c[0][1]['udid']); print(c[0][1]['name'], c[0][0], file=sys.stderr)")
          echo "UDID=$UDID" >> $GITHUB_ENV
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b

      - name: Für den Simulator bauen (Debug)
        run: |
          set -o pipefail
          xcodebuild build -project EllieInsel.xcodeproj -scheme EllieInsel -configuration Debug \
            -destination "id=$UDID" -derivedDataPath dd CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log | grep -E "(error:|BUILD)" || true
          test -f dd/Build/Products/Debug-iphonesimulator/EllieInsel.app/Info.plist && ! grep -q "BUILD FAILED" build.log

      - name: Kompilierfehler
        if: failure()
        run: grep -E "error:" build.log | sed 's|.*/EllieInsel/||' | sort -u | head -100 || true

      - name: Screenshots und automatische Durchläufe
        env:
          ONLY: ${{ github.event.inputs.nur }}
        run: tools/sim_screenshots.sh dd/Build/Products/Debug-iphonesimulator/EllieInsel.app "$UDID" shots

      # Verkleinerte Vorschau auf einem eigenen Branch, damit Prüfer ohne Artefakt-Download sie lesen können.
      # Nur Screenshots und Bericht, kein Code. Jeder Lauf ersetzt den Inhalt (neuer Commit, kein Force-Push).
      - name: Vorschau-Screenshots auf Branch ci-screenshots
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -d shots ] || exit 0
          mkdir -p preview
          for f in shots/*.png; do
            [ -f "$f" ] || continue
            sips -Z 1000 -s format jpeg -s formatOptions 62 "$f" --out "preview/$(basename "${f%.png}").jpg" >/dev/null 2>&1 || true
          done
          cp shots/bericht.txt preview/ 2>/dev/null || true
          [ -d shots/crashes ] && cp -R shots/crashes preview/ 2>/dev/null || true
          printf 'Commit: %s\nRun: %s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > preview/LAUF.txt
          WS="$GITHUB_WORKSPACE"
          cd "$RUNNER_TEMP" && rm -rf pv && mkdir pv && cd pv && git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth=1 origin ci-screenshots 2>/dev/null; then
            git checkout -q -B ci-screenshots FETCH_HEAD
            git rm -rq --ignore-unmatch . >/dev/null
          else
            git checkout -q --orphan ci-screenshots
          fi
          cp -R "$WS/preview/." .
          git add -A
          git commit -qm "Screenshots ${GITHUB_SHA::7} (Run ${GITHUB_RUN_ID})" || exit 0
          git push -q origin ci-screenshots || echo "::warning::Vorschau konnte nicht gepusht werden"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots
          retention-days: 14
