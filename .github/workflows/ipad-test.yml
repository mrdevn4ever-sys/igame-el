name: iPad Simulator-Test

on:
  push:
    branches: [claude/ellies-entdeckerinsel]
    paths:
      - "EllieInsel/**"
      - "tools/sim_screenshots.sh"
      - ".github/workflows/ipad-test.yml"
  workflow_dispatch:

concurrency:
  group: ipad-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Xcode 16 wählen
        run: |
          XC=$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: iPad-Simulator wählen und starten
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          c=[(r,x) for r,l in d.items() if 'iOS' in r for x in l if 'iPad' in x['name']]
          c.sort(key=lambda t:(('iPad Pro 13' in t[1]['name']) or ('iPad Pro (12.9' in t[1]['name']), t[0]), reverse=True)
          print(c[0][1]['udid']); print(c[0][1]['name'], c[0][0], file=sys.stderr)")
          echo "UDID=$UDID" >> $GITHUB_ENV
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b

      - name: Für den Simulator bauen (Debug)
        run: |
          set -o pipefail
          xcodebuild build -project EllieInsel.xcodeproj -scheme EllieInsel -configuration Debug \
            -destination "id=$UDID" -derivedDataPath dd CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log | grep -E "(error:|BUILD)" || true
          test -d dd/Build/Products/Debug-iphonesimulator/EllieInsel.app

      - name: Kompilierfehler
        if: failure()
        run: grep -E "error:" build.log | sed 's|.*/EllieInsel/||' | sort -u | head -100 || true

      - name: Screenshots und automatische Durchläufe
        run: tools/sim_screenshots.sh dd/Build/Products/Debug-iphonesimulator/EllieInsel.app "$UDID" shots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots
          retention-days: 14
